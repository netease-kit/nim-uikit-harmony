<svg xmlns="http://www.w3.org/2000/svg" fill="none" version="1.1" width="36"
     height="36" viewBox="0 0 36 36">
    <g>
        <ellipse cx="18" cy="18" rx="18" ry="18" fill="#337EFF" fill-opacity="1"/>
        <!-- Team icon (two people) -->
        <circle cx="15" cy="13" r="2.5" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
        <path d="M10,24 C10,20.5 12,18 15,18 C18,18 20,20.5 20,24"
              stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <!-- Second person (smaller, behind) -->
        <circle cx="21" cy="14" r="2" stroke="#FFFFFF" stroke-width="1" fill="none"/>
        <path d="M17.5,24 C17.5,21 19,19 21,19 C23,19 24.5,21 24.5,24"
              stroke="#FFFFFF" stroke-width="1" fill="none" stroke-linecap="round"/>
        <!-- Check mark -->
        <path d="M22,11 L23.5,12.5 L26,9.5"
              stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</svg>
